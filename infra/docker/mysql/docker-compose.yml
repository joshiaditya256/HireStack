services:
  mysql:
    image: mysql:8.0
    container_name: hirestack-mysql 
    restart: always     
    environment:
      MYSQL_ROOT_PASSWORD: root    
      # jobConnect is the one authoritative schema -- see infra/docker/mysql/init.sql.
      MYSQL_DATABASE: jobConnect 
      MYSQL_USER: aditya
      MYSQL_PASSWORD: adityapassword
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]  
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hirestack-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hirestack-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: aditya
      RABBITMQ_DEFAULT_PASS: adityarabbitpass

volumes:
  mysql_data:
  redis_data:
